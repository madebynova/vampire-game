name: Deploy website to GitHub Pages

# Publishes ONLY the static site in website/ (never the Godot project).
#
# Manual for now: it can only succeed once Pages is enabled with Source = "GitHub Actions"
# (repo Settings -> Pages). After that, run it from the Actions tab, or uncomment the push
# trigger below to redeploy automatically whenever the website changes.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "website/**"
  #     - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v5
